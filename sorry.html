<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I'm Sorry ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-width: 500px;
            text-align: center;
        }
        h1 {
            margin-bottom: 10px;
            color: #e63946;
        }
        p {
            font-size: 18px;
            line-height: 1.6;
        }
        .heart {
            font-size: 40px;
            animation: beat 1s infinite;
            display: inline-block;
            margin-top: 15px;
        }
        @keyframes beat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        .footer {
            margin-top: 20px;
            font-size: 14px;
            color: #777;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>I'm Sorry</h1>
        <p>
            I know I messed up, and I truly regret it.  
            You mean a lot to me, and I hate that I hurt you.  
        </p>
        <p>
            I’m not just saying sorry, I want to do better, be better, and make things right.  
        </p>
        <p>
            Please forgive me when you're ready. ❤️
        </p>
        <div class="heart">❤️</div>
        <div class="footer">Made with love (and a little regret)</div>
    </div>
</body>
</html>
